[project]
name = "rag-incremental-iceberg"
version = "0.1.0"
description = "Pipeline incremental de chunks para RAG com Apache Iceberg"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
